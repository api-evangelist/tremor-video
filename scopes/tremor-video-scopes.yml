note: >-
  Nexxen publishes no scope reference page and no OpenAPI, so nothing here was read from a scopes
  document. Everything below was read out of two real sources: the OIDC metadata served by the
  Okta authorization server that issues Nexxen DSP API tokens, and the decoded (expired, 2022)
  example access token the provider itself published inside its public Postman collection. The
  DSP API does not ask callers for scopes — a client-credentials call to
  services.amobee.com/accounts/v1/api/token returns a token whose per-service entitlements are
  already baked into the service account.
