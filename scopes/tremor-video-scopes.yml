note_on_oidc_scopes: >-
  These are the Okta authorization server's advertised OIDC scopes, i.e. what the identity tenant
  supports for user sign-in. They are NOT an API permission vocabulary for the DSP API and must not
  be read as one.
authorities:
  model: >-
    Entitlement is carried as an authorities[] claim on the issued token — a coarse per-service
    grant, not a request-time scope. A caller cannot narrow or elevate it; it is set on the API
    service account when the credential is provisioned in the DSP platform.
  source: decoded example access token published in the provider's own Postman collection
  observed:
  - {authority: APP_API_CAMPAIGN_MGMT, grants: Campaign Management service (/campaign/v5/api)}
  - {authority: APP_API_REPORTING, grants: Reporting service (/reporting/v2/api)}
  - {authority: APP_API_DEVICE, grants: Device reference service (/device/v1/api)}
  - {authority: APP_API_LOCATION, grants: Location reference service (/location/v1/api)}
  - {authority: APP_API_DATAMINE, grants: data-mining surface not present in the public collection}
  - {authority: POLICY_API, grants: policy surface not present in the public collection}
  - {authority: APP_TURN_PLATFORM, grants: legacy Turn platform (Amobee acquired Turn)}
  - {authority: ROLE_SERVICE_ACCOUNT, grants: marks the principal as a machine account}
  - {authority: ROLE_INTERNAL, grants: internal role present on the published example token}
  - {authority: Everyone, grants: default Okta group}
  caveat: >-
    This is one example token from one service account, published by the provider in 2022 and now
    expired. It shows the shape and the naming of the entitlement vocabulary; it is not a complete
    or current catalog, and two of the authorities (APP_API_DATAMINE, POLICY_API) point at services
    that have no public documentation at all.
privacy_note: >-
  The subject, email and personal-name claims carried by that example token were deliberately not
  transcribed here, and the token itself has been redacted out of the saved collection.
