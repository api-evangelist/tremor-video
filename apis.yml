apis:
- name: Nexxen DSP API
  description: >-
    REST API for the Nexxen DSP (formerly Amobee / Tremor Video DSP) Campaign Management service —
    advertisers, insertion orders, packages, line items, ads, creatives, audience segments,
    retargeting segments, beacons, inventory lists, publisher deals and location groups. OAuth2
    client-credentials authentication; a shared JSON envelope of queryTotal / data / errors /
    links; offset-limit pagination; marketId scoping with a 300 Multiple Choices disambiguation
    response. Published as a public Postman collection rather than an OpenAPI.
  humanURL: https://www.postman.com/nexxen-api/nexxen/documentation/9md8q3a/nexxen-dsp-apis
  baseURL: https://services.amobee.com/campaign/v5/api
  properties:
  - type: Authentication
    url: authentication/tremor-video-authentication.yml
  - type: PostmanCollection
    url: collections/tremor-video.postman_collection.json
  - type: Examples
    url: examples/tremor-video-examples.yml
  - type: ErrorCatalog
    url: errors/tremor-video-problem-types.yml
  - type: RateLimits
    url: rate-limits/tremor-video-rate-limits.yml
- name: Nexxen DSP Token Service
  description: >-
    OAuth2 client-credentials token service for the Nexxen DSP APIs. A client POSTs its client_id
    and client_secret with grant_type=client_credentials as a JSON body and receives an
    access_token used as a Bearer token on every other Nexxen DSP service. It is the only service
    in the suite that does not itself require an access token.
  humanURL: https://www.postman.com/nexxen-api/nexxen/documentation/9md8q3a/nexxen-dsp-apis
  baseURL: https://services.amobee.com/accounts/v1/api
  properties:
  - type: Authentication
    url: authentication/tremor-video-authentication.yml
  - type: PostmanCollection
    url: collections/tremor-video.postman_collection.json
- name: Nexxen DSP Reporting API
  description: >-
    Asynchronous reporting service for the Nexxen DSP. A report is submitted as a query
    (aggregationType, startTime/endTime, filters by objectType, optional S3 outputPath), answered
    with 202 Accepted and a report id on the Location header, then polled for the result. Scoped to
    limited quick pulls: 19 months lookback, 300MB maximum output, 24-hour result retention, and a
    published limit of 10,000 calls per day at 8 per second.
  humanURL: https://www.postman.com/nexxen-api/nexxen/documentation/9md8q3a/nexxen-dsp-apis
  baseURL: https://services.amobee.com/reporting/v2/api
  properties:
  - type: Authentication
    url: authentication/tremor-video-authentication.yml
  - type: RateLimits
    url: rate-limits/tremor-video-rate-limits.yml
  - type: PostmanCollection
    url: collections/tremor-video.postman_collection.json
- name: Nexxen DSP Device API
  description: >-
    Read-only reference service for the device taxonomy used in Nexxen DSP line-item targeting —
    device types, operating systems, manufacturers and individual devices, each listable and
    retrievable by id and filterable by its parent in the hierarchy.
  humanURL: https://www.postman.com/nexxen-api/nexxen/documentation/9md8q3a/nexxen-dsp-apis
  baseURL: https://services.amobee.com/device/v1/api
  properties:
  - type: Authentication
    url: authentication/tremor-video-authentication.yml
  - type: PostmanCollection
    url: collections/tremor-video.postman_collection.json
- name: Nexxen DSP Location API
  description: >-
    Read-only geographic reference service for Nexxen DSP geo targeting — continents, countries,
    regions, cities, DMAs, named places and street addresses, each listable and retrievable by id,
    with regions filtered by country, cities and DMAs filtered by region, and free-text search on
    places and addresses.
  humanURL: https://www.postman.com/nexxen-api/nexxen/documentation/9md8q3a/nexxen-dsp-apis
  baseURL: https://services.amobee.com/location/v1/api
  properties:
  - type: Authentication
    url: authentication/tremor-video-authentication.yml
  - type: PostmanCollection
    url: collections/tremor-video.postman_collection.json
