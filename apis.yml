name: Tremor Video
description: >-
  Tremor Video DSP is the demand-side platform originally built by Tremor Video and Tremor
  International; following the consolidation of Tremor Video DSP and Amobee it is now marketed as
  the Nexxen DSP, part of the unified Nexxen advertising stack (DSP, SSP, Ad Server and Data
  Platform). It offers a REST API for programmatic and connected-TV (CTV) advertising operations,
  letting partners manage advertisers, insertion orders, packages, line items, ads, creatives,
  audience segments, inventory and publisher deals, plus read-only device and geographic reference
  services and an asynchronous reporting service. The four services sit behind one gateway at
  services.amobee.com and share a single OAuth2 client-credentials bearer token. Nexxen publishes
  no OpenAPI; the machine-readable contract is a public Postman collection of 94 requests with 75
  saved response examples, and API credentials are provisioned inside an existing DSP contract.
