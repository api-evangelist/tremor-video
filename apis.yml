name: Tremor Video
description: >-
  Tremor Video DSP is the demand-side platform originally built by Tremor Video and Tremor
  International; following the consolidation of Tremor Video DSP and Amobee it is now marketed as
  the Nexxen DSP, part of the unified Nexxen advertising stack (DSP, SSP, Ad Server and Data
  Platform). It offers a REST API for programmatic and connected-TV (CTV) advertising operations,
  letting partners manage advertisers, insertion orders, line items, packages and creatives. The
  Nexxen DSP API authenticates with OAuth2 client-credentials (client ID and client secret) and is
  documented publicly through a Nexxen Postman workspace.
